version: 2
updates:
  # CI only: listed under Chores.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - chore
  # Changes the binary: listed under Bug Fixes.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    labels:
      - fix
    ignore:
      # Moves only together with wireguard-go (spec 9).
      - dependency-name: gvisor.dev/gvisor
  # Base and builder images of the Dockerfile; changes the image: Bug Fixes.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    labels:
      - fix
