name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

# Required checks in the main ruleset (job names): Lint, Test, Security,
# Player, Fuzz, Capacity, Build.
# Order: Lint -> Test, Security and Fuzz in parallel -> Player and Capacity
# (after Test) -> Cross-compile -> Build. Fuzz and Capacity run next to Test
# and Player, so they should not lengthen the critical path.
# Every job writes a short summary to the run page ($GITHUB_STEP_SUMMARY).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go cache paths
        id: go
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "version=$(go env GOVERSION)"
            echo "lint=$HOME/.cache/golangci-lint"
          } >> "$GITHUB_OUTPUT"
          echo "GOLANGCI_LINT_CACHE=$HOME/.cache/golangci-lint" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.lint }}
          key: go-lint-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum', '.github/workflows/ci.yml') }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ steps.go.outputs.version }}-
      # go install instead of golangci-lint-action: only GitHub-owned actions
      # are allowed, and the module checksum database verifies the source.
      - name: Install golangci-lint
        run: GOBIN="$RUNNER_TEMP/bin" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: golangci-lint
        run: |
          set +e
          "$RUNNER_TEMP/bin/golangci-lint" run ./... > "$RUNNER_TEMP/lint.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/lint.txt"
          {
            echo "## Lint"
            echo
            if [ "$rc" -eq 0 ]; then
              echo "No issues (golangci-lint ${GOLANGCI_LINT_VERSION})."
            else
              echo "golangci-lint ${GOLANGCI_LINT_VERSION} failed (exit ${rc}):"
              echo
              echo '~~~'
              cat "$RUNNER_TEMP/lint.txt"
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # L2 fuzzing on every push (docs/testing.md): every fuzz target of the
  # module for 10 s. The targets are found with go test -list, as in
  # nightly.yml, so new targets are fuzzed without a change here. One job
  # runs them one after the other; it runs next to Test and Security, off
  # the critical path.
  fuzz:
    name: Fuzz
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FUZZTIME: 10s
      # The default (60s) stalls FuzzRewrite at 0 execs/s while every
      # worker minimises new corpus entries (#24).
      FUZZMINIMIZETIME: 2s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go cache paths
        id: go
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: go-fuzz-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum', '.github/workflows/ci.yml') }}
          restore-keys: |
            go-fuzz-${{ runner.os }}-${{ steps.go.outputs.version }}-
      - name: Fuzz
        run: |
          mod="$(go list -m)"
          if ! go test -json -run '^$' -list '^Fuzz' ./... > "$RUNNER_TEMP/list.json"; then
            jq -j 'select(.Action == "output") | .Output' "$RUNNER_TEMP/list.json"
            echo "## Fuzz" >> "$GITHUB_STEP_SUMMARY"
            echo "Listing the fuzz targets failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # One "<package> <target>" line per target.
          jq -rs '
            .[] | select(.Action == "output" and (.Output | test("^Fuzz[^ \t]*\n$")))
                | "\(.Package) \(.Output | rtrimstr("\n"))"' "$RUNNER_TEMP/list.json" > "$RUNNER_TEMP/targets.txt"
          {
            echo "## Fuzz"
            echo
            echo "$(wc -l < "$RUNNER_TEMP/targets.txt") target(s), ${FUZZTIME} each (\`-fuzzminimizetime ${FUZZMINIMIZETIME}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          while read -r pkg target; do
            name="${pkg#"${mod}"/}.${target}"
            echo "::group::${name}"
            set +e
            go test -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME" -fuzzminimizetime "$FUZZMINIMIZETIME" \
              "$pkg" < /dev/null > "$RUNNER_TEMP/fuzz.txt" 2>&1
            rc=$?
            set -e
            cat "$RUNNER_TEMP/fuzz.txt"
            echo "::endgroup::"
            # A failing input is written to the package's testdata/fuzz.
            # Collect it for the artifact and remove it, so that it is not
            # attributed to the next target.
            git ls-files --others --exclude-standard -- '*testdata/fuzz/*' > "$RUNNER_TEMP/new.txt"
            if [ -s "$RUNNER_TEMP/new.txt" ]; then
              mkdir -p "$RUNNER_TEMP/fuzz-failure"
              while IFS= read -r f; do
                cp --parents "$f" "$RUNNER_TEMP/fuzz-failure/"
                rm "$f"
              done < "$RUNNER_TEMP/new.txt"
            fi
            {
              echo
              echo "### \`${name}\`"
              echo
              if [ "$rc" -eq 0 ]; then
                echo "No failure in ${FUZZTIME}."
                echo
                echo '~~~'
                grep '^fuzz: elapsed' "$RUNNER_TEMP/fuzz.txt" | tail -n 1 || true
                echo '~~~'
              else
                echo "Failed (exit ${rc})."
                if [ -s "$RUNNER_TEMP/new.txt" ]; then
                  echo "Failing input, attached as artifact \`fuzz-failure\`; commit it to make it a regression test:"
                  echo
                  while IFS= read -r f; do
                    echo "- \`${f}\`"
                  done < "$RUNNER_TEMP/new.txt"
                fi
                echo
                echo '~~~'
                tail -n 40 "$RUNNER_TEMP/fuzz.txt"
                echo '~~~'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then
              failed=1
            fi
          done < "$RUNNER_TEMP/targets.txt"
          exit "$failed"
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure
          path: ${{ runner.temp }}/fuzz-failure/
          if-no-files-found: ignore

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go cache paths
        id: go
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: go-test-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum', '.github/workflows/ci.yml') }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ steps.go.outputs.version }}-
      - name: go test
        run: |
          set +e
          go test -race -cover -json ./... > "$RUNNER_TEMP/test.json"
          rc=$?
          set -e
          jq -j 'select(.Action == "output") | .Output' "$RUNNER_TEMP/test.json"
          jq -rs -f .github/scripts/test-summary.jq "$RUNNER_TEMP/test.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # Capacity test of testing.md (L3): 3 viewers through the proxy and
  # in-process tunnels for 30 s, with -race (nightly.yml runs 5 minutes).
  # Its own job next to Player: it starts after Test and adds nothing to
  # the critical path.
  capacity:
    name: Capacity
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      WSP_CAPACITY: 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go cache paths
        id: go
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: go-capacity-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum', '.github/workflows/ci.yml') }}
          restore-keys: |
            go-capacity-${{ runner.os }}-${{ steps.go.outputs.version }}-
      - name: Capacity test
        run: |
          set +e
          go test -race -count=1 -run '^TestCapacity$' -v -timeout 5m -json ./internal/server/capacitytest > "$RUNNER_TEMP/test.json"
          rc=$?
          set -e
          jq -j 'select(.Action == "output") | .Output' "$RUNNER_TEMP/test.json"
          {
            echo "## Capacity"
            echo
            if [ "$rc" -eq 0 ]; then
              echo "Passed (\`WSP_CAPACITY=${WSP_CAPACITY}\`, \`-race\`)."
            else
              echo "Failed (exit ${rc}, \`WSP_CAPACITY=${WSP_CAPACITY}\`, \`-race\`)."
            fi
            echo
            echo '~~~'
            jq -j 'select(.Action == "output" and .Test == "TestCapacity" and (.Output | startswith("    "))) | .Output' "$RUNNER_TEMP/test.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # Security checks of code and dependencies; govulncheck for now.
  security:
    name: Security
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOVULNCHECK_VERSION: v1.9.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go cache paths
        id: go
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: go-security-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum', '.github/workflows/ci.yml') }}
          restore-keys: |
            go-security-${{ runner.os }}-${{ steps.go.outputs.version }}-
      - name: Install govulncheck
        run: GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: govulncheck
        run: |
          set +e
          "$RUNNER_TEMP/bin/govulncheck" ./... > "$RUNNER_TEMP/vuln.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/vuln.txt"
          {
            echo "## Security"
            echo
            if [ "$rc" -eq 0 ]; then
              echo "No vulnerabilities found (govulncheck ${GOVULNCHECK_VERSION})."
            else
              echo "govulncheck ${GOVULNCHECK_VERSION} failed (exit ${rc}):"
              echo
              echo '~~~'
              cat "$RUNNER_TEMP/vuln.txt"
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # L4 player tests (docs/testing.md): ffmpeg plays every media fixture
  # through the proxy and an in-process WireGuard tunnel.
  player:
    name: Player
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go cache paths
        id: go
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: go-player-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum', '.github/workflows/ci.yml') }}
          restore-keys: |
            go-player-${{ runner.os }}-${{ steps.go.outputs.version }}-
      # The runner image does not ship ffmpeg; use the distribution's. The
      # mirror is sometimes very slow (about 50 KB/s for the 66 MB of
      # packages), so the .deb files are cached per runner image and apt
      # retries with a time limit per attempt. Finished downloads stay in
      # the cache directory, so a retry continues where the last one stopped.
      - name: apt cache key
        id: apt
        run: |
          {
            echo "dir=$RUNNER_TEMP/apt-archives"
            echo "image=$ImageOS-$ImageVersion"
          } >> "$GITHUB_OUTPUT"
      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt.outputs.dir }}
          key: apt-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt.outputs.image }}
          restore-keys: |
            apt-ffmpeg-${{ runner.os }}-${{ runner.arch }}-
      - name: Install ffmpeg
        timeout-minutes: 13
        env:
          APT_DIR: ${{ steps.apt.outputs.dir }}
        run: |
          mkdir -p "$APT_DIR/partial"
          apt_opts=(
            -o "Dir::Cache::Archives=$APT_DIR"
            -o APT::Keep-Downloaded-Packages=true
            -o APT::Sandbox::User=root
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get "${apt_opts[@]}" -q update &&
              sudo timeout 240 apt-get "${apt_opts[@]}" -q install -y --no-install-recommends ffmpeg; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt could not install ffmpeg in 3 attempts"
              exit 1
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          # actions/cache runs as the runner user: make the files readable.
          sudo chown -R "$(id -u):$(id -g)" "$APT_DIR"
          ffmpeg -hide_banner -version | head -n 1
      - name: Save apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt.outputs.dir }}
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: go test
        env:
          WSP_PLAYER_TESTS: "1"
        run: |
          set +e
          go test -race -count=1 -json -run '^TestPlayer$' ./internal/server/playertest/ > "$RUNNER_TEMP/player.json"
          rc=$?
          set -e
          jq -j 'select(.Action == "output") | .Output' "$RUNNER_TEMP/player.json"
          {
            jq -rs --arg title Player -f .github/scripts/test-summary.jq "$RUNNER_TEMP/player.json"
            echo
            echo "Player: \`$(ffmpeg -hide_banner -version | head -n 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [test, security, player, fuzz, capacity]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags and history for git describe.
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go cache paths
        id: go
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: go-cross-compile-${{ matrix.goos }}-${{ matrix.goarch }}-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum', '.github/workflows/ci.yml') }}
          restore-keys: |
            go-cross-compile-${{ matrix.goos }}-${{ matrix.goarch }}-${{ runner.os }}-${{ steps.go.outputs.version }}-
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="$(git describe --tags --always)"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/wg-stream-proxy" ./cmd/wg-stream-proxy
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          out="$(./dist/wg-stream-proxy version)"
          echo "$out"
          test "$(head -n 1 <<< "$out")" = "wg-stream-proxy ${VERSION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wg-stream-proxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/wg-stream-proxy
          if-no-files-found: error
      - name: Summary
        env:
          TARGET: ${{ matrix.goos }}/${{ matrix.goarch }}
          ARTIFACT: wg-stream-proxy-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          {
            echo "## Cross-compile ${TARGET}"
            echo
            echo "| Artifact | Version | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            echo "| \`${ARTIFACT}\` | \`${VERSION}\` | $(stat -c %s dist/wg-stream-proxy) bytes | \`$(sha256sum dist/wg-stream-proxy | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Stable name for the required check, independent of the matrix. Runs
  # always, so it also fails when an earlier job failed and the rest skipped.
  build:
    name: Build
    if: always()
    needs: cross-compile
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.cross-compile.result }}
        run: |
          {
            echo "## Build"
            echo
            if [ "$RESULT" = success ]; then
              echo "All targets built; binaries are attached to this run as artifacts."
            else
              echo "Cross-compile result: \`${RESULT}\` (an earlier stage failed or was skipped)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success
