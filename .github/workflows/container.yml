name: Container

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

# Pull requests: a newer push cancels the running build. main and releases
# queue, so the last push always publishes.
concurrency:
  group: container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kingofkalk/wg-stream-proxy
  PLATFORMS: linux/amd64,linux/arm64

# Required check in the main ruleset (job name): Container.
# Publish runs only on push to main (tag edge) and on published releases
# (version tags), never on pull requests.
# Prune (not required) deletes old image versions after a push to main.
#
# docker buildx CLI instead of docker/* actions: only GitHub-owned actions
# are allowed. The Dockerfile cross-compiles in a builder stage on the
# runner's platform, so the arm64 image needs no QEMU.
jobs:
  container:
    name: Container
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags and history for git describe.
          fetch-depth: 0
      - name: Docker
        run: |
          docker version
          docker buildx version
          docker info -f 'storage driver: {{.Driver}} {{.DriverStatus}}'
          echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - name: Build ${{ env.PLATFORMS }}
        run: |
          docker buildx build --platform "$PLATFORMS" \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --provenance=false --sbom=false \
            -t wg-stream-proxy:ci .
      # Only amd64 runs in the smoke test; check that every platform's
      # image holds a binary for its architecture (ELF e_machine).
      - name: Check binary architectures
        run: |
          for platform in ${PLATFORMS//,/ }; do
            id="$(docker create --platform "$platform" wg-stream-proxy:ci)"
            docker cp "$id:/wg-stream-proxy" "$RUNNER_TEMP/bin"
            docker rm "$id" > /dev/null
            machine="$(od -An -tx1 -j18 -N2 "$RUNNER_TEMP/bin" | tr -d ' ')"
            echo "$platform: e_machine ${machine}"
            case "$platform" in
              linux/amd64) test "$machine" = 3e00 ;;
              linux/arm64) test "$machine" = b700 ;;
              *) exit 1 ;;
            esac
          done
      - name: Smoke test (linux/amd64)
        run: .github/scripts/container-smoke.sh wg-stream-proxy:ci "$VERSION"
      - name: Compose file
        run: docker compose -f deploy/compose/compose.yaml config --quiet
      - name: Summary
        run: |
          {
            echo "## Container"
            echo
            echo "Built \`${PLATFORMS}\` (version \`${VERSION}\`); smoke test on linux/amd64 and \`docker compose config\` passed."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: container
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tags
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$EVENT" in
            push)
              tags="edge sha-${GITHUB_SHA::7}"
              ;;
            release)
              # release-please tags vX.Y.Z; push X.Y.Z and X.Y, no latest
              # (deploy.md: pin a version tag).
              if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "unexpected release tag: $RELEASE_TAG" >&2
                exit 1
              fi
              tags="${RELEASE_TAG#v} ${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              ;;
          esac
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
      - name: Build and push
        run: |
          args=()
          for tag in $TAGS; do
            args+=(-t "${IMAGE}:${tag}")
          done
          # No provenance/SBOM attestations: they add two unknown/unknown
          # manifests to every index.
          # Index annotations: ghcr.io shows these for multi-arch images and
          # links the package to this repository.
          docker buildx build --platform "$PLATFORMS" \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --provenance=false --sbom=false \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.description=Routes IPTV streams through userspace WireGuard tunnels and serves them as one M3U8 playlist." \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            --push "${args[@]}" .
      - name: Log out
        if: always()
        run: docker logout ghcr.io
      - name: Summary
        run: |
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")"
          {
            echo "## Publish"
            echo
            echo "| Image | Version | Digest |"
            echo "| --- | --- | --- |"
            for tag in $TAGS; do
              echo "| \`${IMAGE}:${tag}\` | \`${VERSION}\` | \`${digest}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Retention, see .github/scripts/prune-ghcr.sh. Not a required check; it
  # runs only after a push to main, never on pull requests or releases.
  prune:
    name: Prune
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
      - name: Prune old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dry run until the first plans on main have been checked (#56);
          # then remove this line to delete for real.
          DRY_RUN: "1"
        run: .github/scripts/prune-ghcr.sh
      - name: Log out
        if: always()
        run: docker logout ghcr.io
