# Example radio channel file. Kodi's IPTV Simple Client lists a channel in
# its Radio section only if the #EXTINF line carries radio="true"; the file
# default below sets it for every channel in this file.

group = "Radio"
tunnel = "direct"

[defaults.playlist]
attrs = { radio = "true" }

# inputstream.adaptive cannot play MP3 streams: the empty value removes the
# global KODIPROP from _defaults.toml for this file.
[defaults.playlist.extra.KODIPROP]
"inputstream" = ""

[[channel]]
name = "Example Radio"
url = "https://radio.example.com/live/stream.mp3"
