# Example config.toml (spec 5.3). Every key is optional; the values shown
# are the defaults.

listen = ":2349"
log_level = "info"                    # debug | info | warn | error
log_format = "text"                   # text | json
public_base_url = ""                  # default: from the request (scheme, Host)

[upstream]
user_agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/132.0"
connect_timeout = "10s"
header_timeout = "15s"
read_timeout = "30s"
max_playlist_size = "8MiB"            # B, KiB or MiB; at most 32MiB

[upstream.allow_private]              # optional, per route name
direct = []

[tunnels]
idle_timeout = "60m"

[reload]
watch_interval = "2s"                 # check the config files for changes and reload; "0" turns it off

[clips]
error = true                          # error clips instead of 502/504 on GET /c/ of HLS channels

# EPG, one of two modes (spec 6, 6.1):
# link mode, the player fetches the file itself:
# [epg]
# url = "https://epg.example.com/epg.xml.gz"
#
# proxy mode, the proxy fetches each source through its route, keeps only
# the tvg_id of your channels and serves one guide at /epg.xml.gz:
# [epg]
# refresh = "6h"                      # default
#
# [[epg.source]]
# name = "gr"
# url = "https://epg.example.com/epg.xml.gz"
#
# [[epg.source]]
# name = "de"
# url = "https://epg.example.net/guide.xml.gz"
# tunnel = "de"                       # omitted: direct

# [debug]                             # debug endpoints, no authentication (spec 8)
# listen = "127.0.0.1:2350"           # default "": off
